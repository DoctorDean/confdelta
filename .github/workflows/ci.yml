name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev and MSM extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,msm]"

      - name: Run test suite
        run: pytest -ra --cov=confdelta --cov-report=term-missing

  core-only:
    name: Core install (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The core install must work with no optional dependencies at all:
      # importing the package, running the CLI, and running the test suite
      # must all succeed, with MSM-dependent tests skipping rather than
      # failing. pytest is installed on its own, without the dev extra, so
      # nothing optional is pulled in by the back door.
      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest

      - name: Import and CLI smoke check
        run: |
          python -c "import confdelta; print(confdelta.__version__)"
          confdelta --help

      - name: Assert no optional dependency was installed
        run: |
          ! python -c "import deeptime" 2>/dev/null || (echo "deeptime must not be present in a core install" && exit 1)
          ! python -c "import igraph" 2>/dev/null || (echo "igraph must not be present in a core install" && exit 1)

      - name: Run test suite without extras
        run: pytest -ra

  lint:
    name: Lint, format, and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,msm]"

      - name: Ruff
        run: ruff check src/ tests/

      - name: Black (check only)
        run: black --check src/ tests/

      - name: Mypy
        run: mypy

      - name: requirements.txt in sync with pyproject.toml
        run: python scripts/generate_requirements.py --check

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
